# Fukusuke Sushi - entorno local reproducible.
#
# Antes del primer arranque:
#   1) cp .env.example .env          (y cambiar las contraseñas)
#   2) generar los secretos:
#      docker run --rm -v "${PWD}:/work" -w /work node:22-alpine node scripts/generar-secretos.js
# Arranque:  docker compose up --build
#
# Redes:
#   public  -> solo el API Gateway. Es lo único publicado en el equipo (puerto 8080).
#   private -> servicios internos y bases de datos. Es "internal": no tiene salida
#              a Internet y ningún contenedor de esta red publica puertos.

x-mongo-healthcheck: &mongo-healthcheck
  test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:
  # ---------------------------------------------------------------- borde
  api-gateway:
    build: ./services/api-gateway
    environment:
      PORT: 8080
      INVENTORY_URL: http://inventory:3001
      CLIENTS_URL: http://clients:3002
      AUTH_URL: http://auth:3003
      ORDERS_URL: http://orders:3004
      PAYMENTS_URL: http://payments:3005
      GRAPHQL_URL: http://graphql-gateway:3006
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5500}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      SVC_TOKEN_INVENTORY_FILE: /run/secrets/svc_token_gateway_inventory
      SVC_TOKEN_CLIENTS_FILE: /run/secrets/svc_token_gateway_clients
      SVC_TOKEN_AUTH_FILE: /run/secrets/svc_token_gateway_auth
      SVC_TOKEN_ORDERS_FILE: /run/secrets/svc_token_gateway_orders
      SVC_TOKEN_PAYMENTS_FILE: /run/secrets/svc_token_gateway_payments
      SVC_TOKEN_GRAPHQL_FILE: /run/secrets/svc_token_gateway_graphql
    secrets: [jwt_public_key, svc_token_gateway_inventory, svc_token_gateway_clients, svc_token_gateway_auth, svc_token_gateway_orders, svc_token_gateway_payments, svc_token_gateway_graphql]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    networks: [public, private]
    depends_on:
      inventory: { condition: service_healthy }
      clients: { condition: service_healthy }
      auth: { condition: service_healthy }
      orders: { condition: service_healthy }
      payments: { condition: service_healthy }
      graphql-gateway: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------- servicios privados
  inventory:
    build: ./services/inventory
    environment:
      PORT: 3001
      MONGO_URL: mongodb://${MONGO_INVENTORY_USER:?falta en .env}:${MONGO_INVENTORY_PASSWORD:?falta en .env}@mongo-inventory:27017/${MONGO_INVENTORY_DB:-inventory_db}
      SEED_ON_START: "true"
      SVC_TOKEN_GATEWAY_FILE: /run/secrets/svc_token_gateway_inventory
      SVC_TOKEN_ORDERS_FILE: /run/secrets/svc_token_orders_inventory
      SVC_TOKEN_GRAPHQL_FILE: /run/secrets/svc_token_graphql_inventory
    secrets: [svc_token_gateway_inventory, svc_token_orders_inventory, svc_token_graphql_inventory]
    depends_on:
      mongo-inventory: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  clients:
    build: ./services/clients
    environment:
      PORT: 3002
      MONGO_URL: mongodb://${MONGO_CLIENTS_USER:?falta en .env}:${MONGO_CLIENTS_PASSWORD:?falta en .env}@mongo-clients:27017/${MONGO_CLIENTS_DB:-clients_db}
      AUTH_URL: http://auth:3003
      MAIL_ADAPTER: dev
      SVC_TOKEN_GATEWAY_FILE: /run/secrets/svc_token_gateway_clients
      SVC_TOKEN_CLIENTS_AUTH_FILE: /run/secrets/svc_token_clients_auth
      SVC_TOKEN_ORDERS_FILE: /run/secrets/svc_token_orders_clients
      SVC_TOKEN_GRAPHQL_FILE: /run/secrets/svc_token_graphql_clients
    secrets: [svc_token_gateway_clients, svc_token_clients_auth, svc_token_orders_clients, svc_token_graphql_clients]
    depends_on:
      mongo-clients: { condition: service_healthy }
      auth: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  auth:
    build: ./services/auth
    environment:
      PORT: 3003
      MONGO_URL: mongodb://${MONGO_AUTH_USER:?falta en .env}:${MONGO_AUTH_PASSWORD:?falta en .env}@mongo-auth:27017/${MONGO_AUTH_DB:-auth_db}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fukusuke.cl}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      SVC_TOKEN_GATEWAY_FILE: /run/secrets/svc_token_gateway_auth
      SVC_TOKEN_CLIENTS_FILE: /run/secrets/svc_token_clients_auth
    secrets: [jwt_private_key, admin_password, svc_token_gateway_auth, svc_token_clients_auth]
    depends_on:
      mongo-auth: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  orders:
    build: ./services/orders
    environment:
      PORT: 3004
      MONGO_URL: mongodb://${MONGO_ORDERS_USER:?falta en .env}:${MONGO_ORDERS_PASSWORD:?falta en .env}@mongo-orders:27017/${MONGO_ORDERS_DB:-orders_db}
      INVENTORY_URL: http://inventory:3001
      CLIENTS_URL: http://clients:3002
      SVC_TOKEN_GATEWAY_FILE: /run/secrets/svc_token_gateway_orders
      SVC_TOKEN_PAYMENTS_FILE: /run/secrets/svc_token_payments_orders
      SVC_TOKEN_GRAPHQL_FILE: /run/secrets/svc_token_graphql_orders
      SVC_TOKEN_ORDERS_INVENTORY_FILE: /run/secrets/svc_token_orders_inventory
      SVC_TOKEN_ORDERS_CLIENTS_FILE: /run/secrets/svc_token_orders_clients
    secrets: [svc_token_gateway_orders, svc_token_payments_orders, svc_token_graphql_orders, svc_token_orders_inventory, svc_token_orders_clients]
    depends_on:
      mongo-orders: { condition: service_healthy }
      inventory: { condition: service_healthy }
      clients: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  payments:
    build: ./services/payments
    environment:
      PORT: 3005
      MONGO_URL: mongodb://${MONGO_PAYMENTS_USER:?falta en .env}:${MONGO_PAYMENTS_PASSWORD:?falta en .env}@mongo-payments:27017/${MONGO_PAYMENTS_DB:-payments_db}
      ORDERS_URL: http://orders:3004
      PAYMENTS_WEBHOOK_SECRET_FILE: /run/secrets/payments_webhook_secret
      SVC_TOKEN_GATEWAY_FILE: /run/secrets/svc_token_gateway_payments
      SVC_TOKEN_PAYMENTS_ORDERS_FILE: /run/secrets/svc_token_payments_orders
    secrets: [payments_webhook_secret, svc_token_gateway_payments, svc_token_payments_orders]
    depends_on:
      mongo-payments: { condition: service_healthy }
      orders: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  # GraphQL Gateway: privado, sin base de datos propia. Solo agrega contratos internos.
  graphql-gateway:
    build: ./services/graphql-gateway
    environment:
      PORT: 3006
      ORDERS_URL: http://orders:3004
      INVENTORY_URL: http://inventory:3001
      CLIENTS_URL: http://clients:3002
      SVC_TOKEN_GATEWAY_FILE: /run/secrets/svc_token_gateway_graphql
      SVC_TOKEN_GRAPHQL_ORDERS_FILE: /run/secrets/svc_token_graphql_orders
      SVC_TOKEN_GRAPHQL_INVENTORY_FILE: /run/secrets/svc_token_graphql_inventory
      SVC_TOKEN_GRAPHQL_CLIENTS_FILE: /run/secrets/svc_token_graphql_clients
    secrets: [svc_token_gateway_graphql, svc_token_graphql_orders, svc_token_graphql_inventory, svc_token_graphql_clients]
    depends_on:
      orders: { condition: service_healthy }
      inventory: { condition: service_healthy }
      clients: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  # ---------------------------------------------------------------- bases de datos (una por servicio)
  mongo-inventory:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root_inventory
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INVENTORY_ROOT_PASSWORD:?falta en .env}
      MONGO_INITDB_DATABASE: ${MONGO_INVENTORY_DB:-inventory_db}
      APP_DB_USER: ${MONGO_INVENTORY_USER}
      APP_DB_PASSWORD: ${MONGO_INVENTORY_PASSWORD}
    volumes:
      - mongo-inventory-data:/data/db
      - ./infra/mongo/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    healthcheck: *mongo-healthcheck
    networks: [private]
    restart: unless-stopped

  mongo-clients:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root_clients
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_CLIENTS_ROOT_PASSWORD:?falta en .env}
      MONGO_INITDB_DATABASE: ${MONGO_CLIENTS_DB:-clients_db}
      APP_DB_USER: ${MONGO_CLIENTS_USER}
      APP_DB_PASSWORD: ${MONGO_CLIENTS_PASSWORD}
    volumes:
      - mongo-clients-data:/data/db
      - ./infra/mongo/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    healthcheck: *mongo-healthcheck
    networks: [private]
    restart: unless-stopped

  mongo-auth:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root_auth
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_AUTH_ROOT_PASSWORD:?falta en .env}
      MONGO_INITDB_DATABASE: ${MONGO_AUTH_DB:-auth_db}
      APP_DB_USER: ${MONGO_AUTH_USER}
      APP_DB_PASSWORD: ${MONGO_AUTH_PASSWORD}
    volumes:
      - mongo-auth-data:/data/db
      - ./infra/mongo/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    healthcheck: *mongo-healthcheck
    networks: [private]
    restart: unless-stopped

  mongo-orders:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root_orders
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ORDERS_ROOT_PASSWORD:?falta en .env}
      MONGO_INITDB_DATABASE: ${MONGO_ORDERS_DB:-orders_db}
      APP_DB_USER: ${MONGO_ORDERS_USER}
      APP_DB_PASSWORD: ${MONGO_ORDERS_PASSWORD}
    volumes:
      - mongo-orders-data:/data/db
      - ./infra/mongo/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    healthcheck: *mongo-healthcheck
    networks: [private]
    restart: unless-stopped

  mongo-payments:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root_payments
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PAYMENTS_ROOT_PASSWORD:?falta en .env}
      MONGO_INITDB_DATABASE: ${MONGO_PAYMENTS_DB:-payments_db}
      APP_DB_USER: ${MONGO_PAYMENTS_USER}
      APP_DB_PASSWORD: ${MONGO_PAYMENTS_PASSWORD}
    volumes:
      - mongo-payments-data:/data/db
      - ./infra/mongo/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    healthcheck: *mongo-healthcheck
    networks: [private]
    restart: unless-stopped

networks:
  public: {}
  private:
    internal: true

volumes:
  mongo-inventory-data:
  mongo-clients-data:
  mongo-auth-data:
  mongo-orders-data:
  mongo-payments-data:

# Secretos montados como archivos en /run/secrets/<nombre> SOLO en los
# contenedores que los declaran. Se generan con scripts/generar-secretos.js.
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
  admin_password:
    file: ./secrets/admin_password.txt
  svc_token_gateway_inventory:
    file: ./secrets/svc_token_gateway_inventory.txt
  svc_token_gateway_clients:
    file: ./secrets/svc_token_gateway_clients.txt
  svc_token_gateway_auth:
    file: ./secrets/svc_token_gateway_auth.txt
  svc_token_clients_auth:
    file: ./secrets/svc_token_clients_auth.txt
  svc_token_gateway_orders:
    file: ./secrets/svc_token_gateway_orders.txt
  svc_token_gateway_payments:
    file: ./secrets/svc_token_gateway_payments.txt
  svc_token_gateway_graphql:
    file: ./secrets/svc_token_gateway_graphql.txt
  svc_token_orders_inventory:
    file: ./secrets/svc_token_orders_inventory.txt
  svc_token_orders_clients:
    file: ./secrets/svc_token_orders_clients.txt
  svc_token_payments_orders:
    file: ./secrets/svc_token_payments_orders.txt
  svc_token_graphql_orders:
    file: ./secrets/svc_token_graphql_orders.txt
  svc_token_graphql_inventory:
    file: ./secrets/svc_token_graphql_inventory.txt
  svc_token_graphql_clients:
    file: ./secrets/svc_token_graphql_clients.txt
  payments_webhook_secret:
    file: ./secrets/payments_webhook_secret.txt
