<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 3 - Bootstrap y DOM</title>
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Mi Sitio Web</a>
            <button class="btn btn-outline-light ms-auto" data-bs-toggle="modal" data-bs-target="#loginModal">
                Iniciar Sesión
            </button>
        </div>
    </nav>

    <!-- MODAL DE LOGIN -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Acceso de Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" class="form-control" placeholder="Ingresa tu usuario">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" placeholder="Contraseña">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- CARRUSEL RESPONSIVO -->
    <div id="miCarrusel" class="carousel slide my-4 container" data-bs-ride="carousel">
        <div class="carousel-inner rounded">
            <div class="carousel-item active">
                <img src="https://via.placeholder.com/1200x400?text=Promocion+1" class="d-block w-100" alt="Promo 1">
            </div>
            <div class="carousel-item">
                <img src="https://via.placeholder.com/1200x400?text=Promocion+2" class="d-block w-100" alt="Promo 2">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#miCarrusel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#miCarrusel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
    </div>

    <!-- SECCIÓN PARA INYECTAR EL SELECT DINÁMICO (DOM) -->
    <div class="container my-5 text-center">
        <h3>Selecciona un Producto (Cargado con JS)</h3>
        <div id="contenedor-combo" class="mt-3 w-50 mx-auto">
            <!-- Aquí aparecerá el ComboBox creado por JavaScript -->
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p class="mb-0">© 2024 - Entrega Semana 3</p>
    </footer>

    <!-- SCRIPT DE BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SCRIPT DE JAVASCRIPT (LÓGICA DEL DOM Y OBJETOS) -->
    <script>
        // 1. Simulamos la respuesta de una API en formato JSON con Objetos
        const resAPI = {
            status: 200,
            message: "productos obtenidos",
            data: [
                { id: 1, nombre: "Martillo" },
                { id: 2, nombre: "Tijera" },
                { id: 3, nombre: "Destornillador" }
            ]
        };

        // 2. Creamos el elemento <select> dinámicamente
        let cmbProducto = document.createElement('select');
        cmbProducto.setAttribute('name', 'cmbProducto');
        cmbProducto.classList.add('form-select'); // Clase de Bootstrap para que se vea bien

        // 3. Recorremos la data con forEach y una función flecha
        resAPI.data.forEach(prod => {
            // Por cada producto, creamos un <option>
            let opt = document.createElement('option');
            opt.setAttribute('value', prod.id);
            opt.innerText = prod.nombre;
            
            // Agregamos la opción al ComboBox
            cmbProducto.appendChild(opt);
        });

        // 4. Inyectamos el ComboBox terminado en el HTML
        document.getElementById('contenedor-combo').appendChild(cmbProducto);
    </script>
</body>
</html>
